name: Build and release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Test and package Linux ${{ matrix.arch }}
    if: github.event_name == 'pull_request' || !github.event.deleted
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # The packager validates stable version tags; ordinary builds use a smoke-test version.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Release builds use stable Go; go.mod declares the minimum source-compatible version.
          go-version: stable
          cache: false
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [[ -n "$files" ]]; then
            printf 'Run gofmt on:\n%s\n' "$files" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Verify SES handoff, failures and recovery with a real Postfix queue
        run: bash tests/postfix/test.sh
      - name: Build and smoke-test release archive
        run: bash scripts/package.sh "$VERSION" dist
      - name: Stage archive for release
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/postfix-ses-go_${{ env.VERSION }}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: build
    if: github.repository == 'pavelsg/postfix-ses-go' && github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Publish both archives and their SHA-256 checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          archives=("postfix-ses-go_${VERSION}_linux_amd64.tar.gz" "postfix-ses-go_${VERSION}_linux_arm64.tar.gz")
          sha256sum "${archives[@]}" > SHA256SUMS
          gh release create "$VERSION" "${archives[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
